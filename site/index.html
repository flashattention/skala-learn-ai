<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Engineer 기술면접 대비</title>
  <meta name="description" content="AI·Data 엔지니어 신입 기술면접 대비 — Python·ML·DL·LLM·RAG·Agent·MLOps 개념 학습, 면접 Q&amp;A, 퀴즈, 오답노트, AI 모의면접" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 예전 저장 키(skax-*)를 새 키(aie-*)로 옮김 — 기존 학습 기록 유지
    try { for (const k of Object.keys(localStorage)) if (k.startsWith('skax-')) { const n = 'aie-' + k.slice(5); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); localStorage.removeItem(k); } } catch (e) {}
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/">
      <span class="brand-logo">🎯</span>
      <span class="brand-text"><b>AI Engineer 기술면접 대비</b><small>개념 학습 · 면접 Q&amp;A · 퀴즈 · AI 모의면접</small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">대시보드</a>
      <a href="#/learn" data-nav="learn">분야별 학습</a>
      <a href="#/notes" data-nav="notes">오답노트 <span class="pill" id="noteCount">0</span></a>
      <a href="#/history" data-nav="history">기록</a>
      <a href="#/mock" data-nav="mock">모의면접</a>
      <a href="#/search" data-nav="search" title="검색">🔍</a>
    </nav>
    <div class="user-area">
      <button class="icon-btn" id="themeBtn" title="다크/라이트 모드">🌓</button>
      <div class="user-chip" id="userChip"></div>
    </div>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  </header>

  <main id="app" class="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 콘텐츠 데이터 (분야별) -->
  <script src="data/registry.js"></script>
  <script defer src="data/python.js"></script>
  <script defer src="data/ml.js"></script>
  <script defer src="data/dl.js"></script>
